<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PULSE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600&display=swap');

:root {
  --bg:          #0a0c0f;
  --bg2:         #111318;
  --bg3:         #181c23;
  --bg4:         #1e2330;
  --border:      #1f2535;
  --border2:     #2a3348;
  --text:        #c9d1e0;
  --text-muted:  #5a6580;
  --text-dim:    #3a4258;
  --online:      #00e676;
  --away:        #ffb300;
  --dnd:         #ff3d57;
  --offline:     #2a3348;
  --call:        #00e676;
  --accent:      #4f8fff;
  --mono:        'JetBrains Mono', monospace;
  --sans:        'Inter', sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 12px;
  height: 100dvh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ── HEADER ───────────────────────────────────── */
#header {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 8px 10px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

#own-avatar {
  width: 26px; height: 26px;
  border-radius: 4px;
  background: var(--bg4);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono);
  font-size: 10px; font-weight: 700;
  color: var(--text-muted);
  flex-shrink: 0;
  position: relative;
  user-select: none;
}
#own-status-dot {
  position: absolute;
  bottom: -2px; right: -2px;
  width: 8px; height: 8px;
  border-radius: 50%;
  border: 2px solid var(--bg2);
  background: var(--offline);
  transition: background .3s;
}

#own-info { flex: 1; min-width: 0; }
#own-name {
  font-family: var(--mono);
  font-size: 11px; font-weight: 600;
  color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#own-label {
  font-size: 10px; color: var(--text-muted);
  font-family: var(--mono);
}

#notif-btn {
  background: none; border: 1px solid var(--border2);
  color: var(--text-muted); border-radius: 3px;
  padding: 3px 6px; cursor: pointer; font-size: 10px;
  font-family: var(--mono);
  transition: all .15s;
  white-space: nowrap; flex-shrink: 0;
}
#notif-btn:hover { border-color: var(--accent); color: var(--accent); }
#notif-btn.granted { display: none; }

/* ── STATUS BAR ───────────────────────────────── */
#status-bar {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 3px; padding: 6px 8px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  background: var(--bg2);
}
.s-btn {
  display: flex; flex-direction: column;
  align-items: center; gap: 2px;
  padding: 5px 2px; border-radius: 3px;
  border: 1px solid transparent;
  background: var(--bg3);
  color: var(--text-muted);
  cursor: pointer; font-family: var(--mono);
  font-size: 9px; font-weight: 600;
  letter-spacing: .04em; text-transform: uppercase;
  transition: all .12s;
  position: relative;
}
.s-btn:hover { background: var(--bg4); color: var(--text); }
.s-btn.active { background: var(--bg4); border-color: var(--border2); color: var(--text); }
.s-btn .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.s-btn[data-status="online"]  .dot { background: var(--online); }
.s-btn[data-status="away"]    .dot { background: var(--away); }
.s-btn[data-status="dnd"]     .dot { background: var(--dnd); }
.s-btn[data-status="offline"] .dot { background: var(--text-dim); }
.auto-tag {
  position: absolute; top: 2px; right: 3px;
  font-size: 7px; color: var(--accent);
  font-family: var(--mono); font-weight: 700;
}

/* ── MSG ROW ──────────────────────────────────── */
#msg-row {
  display: flex; gap: 4px; padding: 5px 8px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0; background: var(--bg2);
}
#status-msg {
  flex: 1; background: var(--bg3);
  border: 1px solid var(--border);
  color: var(--text); border-radius: 3px;
  padding: 4px 8px; font-size: 11px; font-family: var(--mono);
  outline: none; transition: border-color .15s;
}
#status-msg:focus { border-color: var(--accent); }
#status-msg::placeholder { color: var(--text-dim); }
#reset-btn {
  background: var(--bg3); border: 1px solid var(--border);
  color: var(--text-muted); border-radius: 3px;
  padding: 4px 8px; cursor: pointer;
  font-family: var(--mono); font-size: 10px;
  transition: all .12s; white-space: nowrap;
}
#reset-btn:hover { border-color: var(--border2); color: var(--text); }

/* ── SECTION HEADER ───────────────────────────── */
.section-hdr {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 10px 3px; flex-shrink: 0;
}
.section-hdr .lbl {
  font-family: var(--mono); font-size: 9px; font-weight: 700;
  letter-spacing: .1em; text-transform: uppercase; color: var(--text-dim);
}
.section-hdr .cnt {
  font-family: var(--mono); font-size: 9px; color: var(--text-dim);
  background: var(--bg3); padding: 1px 6px; border-radius: 2px;
}

/* ── MEMBER LIST ──────────────────────────────── */
#member-list { flex: 1; overflow-y: auto; padding: 2px 6px 6px; }
#member-list::-webkit-scrollbar { width: 3px; }
#member-list::-webkit-scrollbar-track { background: transparent; }
#member-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.member-row {
  display: flex; align-items: center; gap: 8px;
  padding: 4px 6px; border-radius: 3px; margin-bottom: 1px;
  cursor: default; transition: background .1s;
}
.member-row:hover { background: var(--bg3); }

.m-avatar {
  width: 26px; height: 26px; border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 10px; font-weight: 700;
  color: rgba(255,255,255,.7);
  flex-shrink: 0; position: relative; user-select: none;
}
.av0{background:#1a3a5c}.av1{background:#3a1a5c}.av2{background:#1a5c3a}
.av3{background:#5c3a1a}.av4{background:#5c1a1a}.av5{background:#1a4a5c}
.av6{background:#4a1a5c}.av7{background:#1a5c4a}

.m-dot {
  position: absolute; bottom: -1px; right: -1px;
  width: 8px; height: 8px; border-radius: 50%;
  border: 2px solid var(--bg); transition: background .3s;
}
.member-row:hover .m-dot { border-color: var(--bg3); }
.dot-online  { background: var(--online) !important; }
.dot-away    { background: var(--away)   !important; }
.dot-dnd     { background: var(--dnd)    !important; }
.dot-offline { background: var(--offline)!important; }

.m-info { flex: 1; min-width: 0; }
.m-name {
  font-family: var(--mono); font-size: 11px; font-weight: 600;
  color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.member-row.is-offline .m-name { color: var(--text-muted); }
.m-sub {
  font-size: 10px; color: var(--text-muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px;
}

.call-badge {
  display: flex; align-items: center; gap: 3px;
  font-family: var(--mono); font-size: 9px; font-weight: 700;
  color: var(--call); letter-spacing: .05em;
  padding: 2px 5px; border: 1px solid rgba(0,230,118,.2);
  border-radius: 2px; background: rgba(0,230,118,.06);
  flex-shrink: 0; animation: callpulse 2s infinite;
}
.call-badge::before {
  content:''; width:5px; height:5px; border-radius:50%;
  background: var(--call); animation: callpulse 2s infinite;
}
@keyframes callpulse { 0%,100%{opacity:1} 50%{opacity:.4} }

.list-divider { height:1px; background:var(--border); margin:4px 4px 5px; }

.group-hdr {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 6px 2px;
}
.group-hdr .lbl {
  font-family: var(--mono); font-size: 9px; font-weight: 700;
  letter-spacing: .1em; text-transform: uppercase; color: var(--text-dim);
}
.group-hdr .cnt {
  font-family: var(--mono); font-size: 9px; color: var(--text-dim);
}

/* ── BOTTOM BAR ───────────────────────────────── */
#bottom-bar {
  border-top: 1px solid var(--border); background: var(--bg2);
  padding: 4px 10px; display: flex; align-items: center; gap: 6px; flex-shrink: 0;
}
.live-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--online); animation: blink 2s infinite; flex-shrink: 0;
}
.live-dot.err { background: var(--dnd); animation: none; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.15} }
#bottom-text {
  font-family: var(--mono); font-size: 9px; color: var(--text-dim);
  flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#audio-btn {
  background: none; border: none; color: var(--text-dim);
  cursor: pointer; font-size: 13px; padding: 0 2px;
  transition: color .15s; line-height: 1; flex-shrink: 0;
}
#audio-btn:hover { color: var(--text); }

/* ── HINT / LOGIN ─────────────────────────────── */
#hint {
  flex: 1; display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 10px; color: var(--text-dim);
  padding: 20px; text-align: center; line-height: 2;
  white-space: pre-line;
}
#login-form {
  padding: 12px 10px; display: none; flex-direction: column; gap: 6px;
}
#login-form.visible { display: flex; }
.f-label {
  font-family: var(--mono); font-size: 9px; font-weight: 700;
  letter-spacing: .08em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 2px;
}
.f-input {
  background: var(--bg3); border: 1px solid var(--border);
  color: var(--text); border-radius: 3px;
  padding: 6px 9px; font-size: 11px; font-family: var(--mono);
  outline: none; transition: border-color .15s; width: 100%;
}
.f-input:focus { border-color: var(--accent); }
.f-input::placeholder { color: var(--text-dim); }
.f-btn {
  background: var(--accent); border: none; color: #fff; border-radius: 3px;
  padding: 7px; cursor: pointer; font-family: var(--mono);
  font-size: 11px; font-weight: 600; letter-spacing: .04em; transition: opacity .15s;
}
.f-btn:hover { opacity: .85; }
.f-hint { font-size: 10px; color: var(--text-dim); font-family: var(--mono); line-height: 1.6; }
</style>
</head>
<body>

<div id="header">
  <div id="own-avatar">--<div id="own-status-dot"></div></div>
  <div id="own-info">
    <div id="own-name">PULSE</div>
    <div id="own-label">nicht verbunden</div>
  </div>
  <button id="notif-btn" style="display:none">🔔 AN</button>
</div>

<div id="status-bar">
  <button class="s-btn active" data-status="online">
    <div class="dot"></div>ONLINE<span class="auto-tag" id="auto-tag">AUTO</span>
  </button>
  <button class="s-btn" data-status="away"><div class="dot"></div>WEG</button>
  <button class="s-btn" data-status="dnd"><div class="dot"></div>DND</button>
  <button class="s-btn" data-status="offline"><div class="dot"></div>UNSICHTB.</button>
</div>

<div id="msg-row">
  <input id="status-msg" type="text" placeholder="Statusnachricht…" maxlength="80">
  <button id="reset-btn">⟳ AUTO</button>
</div>

<div class="section-hdr" id="members-hdr" style="display:none">
  <span class="lbl">MITGLIEDER</span>
  <span class="cnt" id="member-count">–</span>
</div>

<div id="hint">PULSE\nverbinde…</div>
<div id="member-list" style="display:none"></div>

<div id="login-form">
  <div class="f-hint">Kein Token gefunden.<br>Element → Einstellungen → Sicherheit → Zugriffs-Token</div>
  <div><div class="f-label">Access Token</div><input id="f-token" class="f-input" type="password" placeholder="syt_…"></div>
  <div><div class="f-label">User-ID</div><input id="f-user" class="f-input" type="text" placeholder="@name:server"></div>
  <div><div class="f-label">Raum-ID (optional)</div><input id="f-room" class="f-input" type="text" placeholder="!abc:server"></div>
  <button class="f-btn" onclick="doConnect()">VERBINDEN</button>
</div>

<div id="bottom-bar">
  <div class="live-dot err" id="live-dot"></div>
  <span id="bottom-text">warte auf Verbindung…</span>
  <button id="audio-btn" title="Audio an/aus">🔊</button>
</div>

<script>
'use strict';

const HS      = "https://stiftung-waffentest.de";
const IDLE_MS = 5  * 60 * 1000;
const AWAY_MS = 15 * 60 * 1000;
const PUSH_MS = 30_000;
const SYNC_MS = 60_000;

const S = {
  token:null, userId:null, roomId:null,
  manualStatus:null, autoStatus:"online",
  lastActivity:Date.now(),
  members:{},
  audioOn:true,
  prevPresence:{},
  prevCalls:{},
};

const STATUS = {
  online:  {label:"Online",       dot:"dot-online",  presence:"online",      msg:""},
  away:    {label:"Abwesend",     dot:"dot-away",    presence:"unavailable", msg:"Abwesend"},
  dnd:     {label:"Nicht stören", dot:"dot-dnd",     presence:"online",      msg:"Nicht stören"},
  offline: {label:"Unsichtbar",   dot:"dot-offline", presence:"offline",     msg:""},
};

// ── Audio ───────────────────────────────────────
let _actx = null;
function actx() {
  if (!_actx) _actx = new (window.AudioContext || window.webkitAudioContext)();
  return _actx;
}
function tone(freq, type, dur, vol=0.25) {
  if (!S.audioOn) return;
  try {
    const ctx=actx(), osc=ctx.createOscillator(), g=ctx.createGain();
    osc.connect(g); g.connect(ctx.destination);
    osc.type=type; osc.frequency.setValueAtTime(freq, ctx.currentTime);
    g.gain.setValueAtTime(vol, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+dur);
    osc.start(); osc.stop(ctx.currentTime+dur);
  } catch(e){}
}
function sfx_online()  { tone(660,'sine',.1,.22); setTimeout(()=>tone(880,'sine',.18,.18),90); }
function sfx_offline() { tone(440,'sine',.1,.18); setTimeout(()=>tone(293,'sine',.2,.15),90); }
function sfx_call()    { tone(523,'sine',.08,.2); setTimeout(()=>tone(659,'sine',.08,.2),80); setTimeout(()=>tone(784,'sine',.18,.18),160); }
function sfx_callend() { tone(392,'sine',.1,.18); setTimeout(()=>tone(330,'sine',.18,.15),90); }

// ── Notifications ───────────────────────────────
function askNotif() {
  Notification.requestPermission().then(p => {
    if (p==='granted') document.getElementById('notif-btn').classList.add('granted');
  });
}
function notify(title, body, icon='🟢') {
  if (Notification.permission !== 'granted') return;
  try { new Notification(`${icon} ${title}`, {body, silent:true, tag:title}); } catch(e){}
}

// ── Widget postMessage / OpenID ─────────────────
let widgetId=null, wSrc=null;
const _pend={};
function wpost(action, data={}) {
  const rid=Math.random().toString(36).slice(2);
  (wSrc||window.parent).postMessage({api:"fromWidget",widgetId,requestId:rid,action,data},"*");
  return new Promise(r=>{
    _pend[rid]=r;
    setTimeout(()=>{if(_pend[rid]){delete _pend[rid];r(null);}},8000);
  });
}
window.addEventListener("message", async e=>{
  const m=e.data; if(!m) return;
  if(m.requestId && _pend[m.requestId]){_pend[m.requestId](m.data??m.response);delete _pend[m.requestId];return;}
  if(m.action==="capabilities"){
    widgetId=m.widgetId||widgetId; wSrc=e.source;
    e.source.postMessage({api:"fromWidget",widgetId,requestId:m.requestId,action:"capabilities",data:{capabilities:["m.always_on_screen"]}},"*");
    return;
  }
  if(m.action==="openid_credentials" && m.data?.access_token){
    wSrc=e.source;
    e.source.postMessage({api:"fromWidget",widgetId,requestId:m.requestId,action:"openid_credentials",data:{success:true}},"*");
    await useOpenId(m.data);
  }
});
async function tryOpenId(){
  let r=await wpost("get_openid",{});
  if(r?.access_token){await useOpenId(r);return;}
  r=await wpost("org.matrix.msc2762.get_openid",{});
  if(r?.access_token){await useOpenId(r);return;}
  if(!S.token) showLoginForm();
}
async function useOpenId(od){
  try{
    const r=await fetch(`${HS}/_matrix/federation/v1/openid/userinfo?access_token=${od.access_token}`);
    if(r.ok){const d=await r.json();S.userId=S.userId||d.sub;}
  }catch{}
  S.token=od.access_token;
  await start();
}

// ── Matrix API ──────────────────────────────────
const enc=s=>encodeURIComponent(s);
async function api(method,path,body){
  if(!S.token) return null;
  try{
    const r=await fetch(`${HS}/_matrix/client/v3${path}`,{
      method, headers:{Authorization:`Bearer ${S.token}`,"Content-Type":"application/json"},
      body:body?JSON.stringify(body):undefined,
    });
    if(!r.ok) return null;
    return r.json();
  }catch{return null;}
}
const GET=(p)=>api("GET",p);
const PUT=(p,b)=>api("PUT",p,b);

async function setPresence(key,msg){
  if(!S.userId) return;
  const s=STATUS[key];
  const m=msg!==undefined?msg:s.msg;
  await PUT(`/presence/${enc(S.userId)}/status`,{presence:s.presence,status_msg:m});
}

// ── Boot ─────────────────────────────────────────
async function boot(){
  const p=new URLSearchParams(location.search);
  S.userId  = p.get("userId")||p.get("user_id")||null;
  S.roomId  = p.get("roomId")||p.get("room_id")||null;
  widgetId  = p.get("widgetId")||"pulse-widget";
  S.audioOn = p.get("audio")!=="0";

  try{const t=sessionStorage.getItem("pulse_tok");if(t){S.token=t;S.userId=S.userId||sessionStorage.getItem("pulse_uid");}}catch{}
  if(!S.token){
    try{for(const k of Object.keys(localStorage)){
      if(k.includes("mx_access_token")) S.token=localStorage.getItem(k);
      if(k.includes("mx_user_id")&&!S.userId) S.userId=localStorage.getItem(k);
    }}catch{}
  }
  if(S.token){await start();return;}
  setTimeout(()=>{if(!S.token)showLoginForm();},4000);
  tryOpenId();
}

function showLoginForm(){
  document.getElementById('hint').style.display='none';
  document.getElementById('login-form').classList.add('visible');
  setBottom("manueller Login erforderlich",true);
}

window.doConnect=async function(){
  const t=document.getElementById('f-token')?.value.trim();
  const u=document.getElementById('f-user')?.value.trim();
  const r=document.getElementById('f-room')?.value.trim();
  if(!t||!u){alert("Token und User-ID sind Pflichtfelder");return;}
  S.token=t;S.userId=u;if(r)S.roomId=r;
  try{sessionStorage.setItem("pulse_tok",t);sessionStorage.setItem("pulse_uid",u);}catch{}
  document.getElementById('login-form').classList.remove('visible');
  document.getElementById('hint').style.display='flex';
  document.getElementById('hint').textContent='Verbinde…';
  await start();
};

// ── Start ────────────────────────────────────────
async function start(){
  if(S.userId){
    const d=await GET(`/profile/${enc(S.userId)}/displayname`);
    const name=d?.displayname||S.userId.split(":")[0].replace("@","");
    document.getElementById('own-name').textContent=name;
    const av=document.getElementById('own-avatar');
    av.childNodes[0].nodeValue=name.slice(0,2).toUpperCase();
  }
  if(!S.roomId){
    try{const m=window.parent.location.hash.match(/#\/room\/([^/?]+)/);if(m)S.roomId=decodeURIComponent(m[1]);}catch{}
  }
  await setPresence("online","");
  updateBar();

  if(Notification.permission==='granted') document.getElementById('notif-btn').classList.add('granted');
  else if(Notification.permission!=='denied'){
    document.getElementById('notif-btn').style.display='';
  }

  await syncMembers();
  setInterval(checkIdle,30_000);
  setInterval(syncMembers,SYNC_MS);
  setInterval(()=>setPresence(cur(),document.getElementById('status-msg').value.trim()||undefined),PUSH_MS);
}

// ── Sync ─────────────────────────────────────────
async function syncMembers(){
  if(!S.roomId){
    document.getElementById('hint').style.display='flex';
    document.getElementById('hint').textContent='Kein Raum erkannt.\nBitte Raum-ID eingeben.';
    document.getElementById('member-list').style.display='none';
    document.getElementById('members-hdr').style.display='none';
    setBottom("kein Raum",true);
    return;
  }
  const data=await GET(`/rooms/${enc(S.roomId)}/members`);
  const joined=(data?.chunk||[]).filter(m=>m.content?.membership==="join");

  for(const m of joined){
    const uid=m.state_key; if(!uid) continue;
    const nd=await GET(`/profile/${enc(uid)}/displayname`);
    const name=nd?.displayname||uid.split(":")[0].replace("@","");
    const pres=await GET(`/presence/${enc(uid)}/status`);

    let status="offline";
    if(pres){
      if(pres.status_msg==="Nicht stören")  status="dnd";
      else if(pres.status_msg==="Abwesend") status="away";
      else if(pres.presence==="online")      status="online";
      else if(pres.presence==="unavailable") status="away";
    }

    // Call-Status via MSC3401/MSC4143 State Event
    const callEv=await GET(`/rooms/${enc(S.roomId)}/state/org.matrix.msc3401.call.member/${enc(uid)}`);
    const inCall=callEv && Object.keys(callEv).length>0;

    // Änderungs-Detection → Audio + Notification
    const prevSt=S.prevPresence[uid];
    const prevCl=S.prevCalls[uid];
    if(prevSt!==undefined){
      if(prevSt!==status){
        if(status==="online")  {sfx_online();  notify(name,"ist jetzt online","🟢");}
        if(status==="offline") {sfx_offline(); notify(name,"ist offline gegangen","⚫");}
      }
    }
    if(prevCl!==undefined && prevCl!==inCall){
      if(inCall)  {sfx_call();    notify(name,"ist einem Call beigetreten","🎙️");}
      if(!inCall) {sfx_callend(); notify(name,"hat den Call verlassen","📵");}
    }
    S.prevPresence[uid]=status;
    S.prevCalls[uid]=inCall;
    S.members[uid]={name,status,ago:pres?.last_active_ago??null,statusMsg:pres?.status_msg??"",inCall};
  }

  renderMembers();
  const online=Object.values(S.members).filter(m=>m.status!=="offline").length;
  setBottom(`${online} online · ${Object.keys(S.members).length} gesamt`,false);
}

// ── Render ────────────────────────────────────────
function renderMembers(){
  const list=document.getElementById('member-list');
  document.getElementById('hint').style.display='none';
  list.style.display='';
  document.getElementById('members-hdr').style.display='';

  const entries=Object.entries(S.members);
  if(!entries.length) return;

  const ord={online:0,dnd:1,away:2,offline:3};
  entries.sort(([,a],[,b])=>(ord[a.status]??4)-(ord[b.status]??4)||a.name.localeCompare(b.name));
  document.getElementById('member-count').textContent=entries.length;

  const groups=[
    {label:"ONLINE",   items:entries.filter(([,m])=>m.status==="online")},
    {label:"ABWESEND", items:entries.filter(([,m])=>m.status==="away"||m.status==="dnd")},
    {label:"OFFLINE",  items:entries.filter(([,m])=>m.status==="offline")},
  ];

  list.innerHTML="";
  let firstOffline=true;

  for(const {label,items} of groups){
    if(!items.length) continue;
    if(label==="OFFLINE" && entries.some(([,m])=>m.status!=="offline")){
      const div=document.createElement('div'); div.className='list-divider'; list.appendChild(div);
    }
    const ghdr=document.createElement('div'); ghdr.className='group-hdr';
    ghdr.innerHTML=`<span class="lbl">${label}</span><span class="cnt">${items.length}</span>`;
    list.appendChild(ghdr);

    for(const [uid,m] of items){
      let h=0; for(const c of uid) h=(h*31+c.charCodeAt(0))&0xffff;
      const av="av"+(h%8);
      const ini=(m.name||uid).slice(0,2).toUpperCase();
      const sub=m.inCall?"🎙 Im Call":(m.statusMsg||STATUS[m.status]?.label||"");
      const ago=fmtAgo(m.ago);
      const row=document.createElement('div');
      row.className=`member-row${m.status==="offline"?" is-offline":""}`;
      row.innerHTML=`
        <div class="m-avatar ${av}">${esc(ini)}<div class="m-dot ${STATUS[m.status]?.dot||'dot-offline'}"></div></div>
        <div class="m-info">
          <div class="m-name">${esc(m.name||uid.split(":")[0].replace("@",""))}</div>
          <div class="m-sub">${esc(sub)}${ago&&!m.inCall?` · ${ago}`:""}</div>
        </div>
        ${m.inCall?`<div class="call-badge">CALL</div>`:""}
      `;
      list.appendChild(row);
    }
  }
}

// ── Idle ──────────────────────────────────────────
function onActivity(){
  S.lastActivity=Date.now();
  if(S.manualStatus===null&&S.autoStatus!=="online"){
    S.autoStatus="online";
    setPresence("online",document.getElementById('status-msg').value.trim()||"");
    updateBar();
  }
}
["mousemove","keydown","click","scroll"].forEach(ev=>
  document.addEventListener(ev,onActivity,{passive:true})
);
function checkIdle(){
  if(S.manualStatus!==null) return;
  const idle=Date.now()-S.lastActivity;
  const next=idle>=AWAY_MS?"offline":idle>=IDLE_MS?"away":"online";
  if(next!==S.autoStatus){S.autoStatus=next;setPresence(next);updateBar();}
}
function cur(){return S.manualStatus||S.autoStatus;}

// ── UI ────────────────────────────────────────────
function updateBar(){
  const key=cur(),isAuto=S.manualStatus===null;
  document.querySelectorAll('.s-btn').forEach(b=>b.classList.toggle('active',b.dataset.status===key));
  document.getElementById('auto-tag').style.display=isAuto?'':'none';
  document.getElementById('own-status-dot').style.background=
    {online:"var(--online)",away:"var(--away)",dnd:"var(--dnd)",offline:"var(--offline)"}[key]||"var(--offline)";
  document.getElementById('own-label').textContent=isAuto?STATUS[key].label+" (auto)":STATUS[key].label;
}
function setBottom(msg,err=false){
  document.getElementById('bottom-text').textContent=msg;
  document.getElementById('live-dot').classList.toggle('err',err);
}
function fmtAgo(ms){
  if(!ms) return "";
  const m=Math.round(ms/60000);
  if(m<1)  return "gerade";
  if(m<60) return `${m} min`;
  const h=Math.round(m/60);
  return h<24?`${h} Std`:`${Math.round(h/24)} d`;
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

// ── Events ────────────────────────────────────────
document.querySelectorAll('.s-btn').forEach(b=>b.addEventListener('click',()=>{
  S.manualStatus=b.dataset.status;
  setPresence(b.dataset.status,document.getElementById('status-msg').value.trim()||undefined);
  updateBar(); actx();
}));
document.getElementById('status-msg').addEventListener('keydown',e=>{
  if(e.key==='Enter') setPresence(cur(),e.target.value.trim()||undefined);
});
document.getElementById('reset-btn').addEventListener('click',()=>{
  S.manualStatus=null;S.autoStatus="online";
  document.getElementById('status-msg').value="";
  setPresence("online","");updateBar();
});
document.getElementById('audio-btn').addEventListener('click',()=>{
  S.audioOn=!S.audioOn;
  document.getElementById('audio-btn').textContent=S.audioOn?"🔊":"🔇";
  actx();
  if(S.audioOn) sfx_online();
});
document.getElementById('notif-btn').addEventListener('click',askNotif);

boot();
</script>
