<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PULSE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600&display=swap');

:root {
  --bg:          #0a0c0f;
  --bg2:         #111318;
  --bg3:         #181c23;
  --bg4:         #1e2330;
  --border:      #1f2535;
  --border2:     #2a3348;
  --text:        #c9d1e0;
  --text-muted:  #5a6580;
  --text-dim:    #3a4258;
  --online:      #00e676;
  --away:        #ffb300;
  --dnd:         #ff3d57;
  --offline:     #2a3348;
  --call:        #00e676;
  --accent:      #4f8fff;
  --mono:        'JetBrains Mono', monospace;
  --sans:        'Inter', sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: var(--sans); font-size: 12px;
  height: 100dvh; overflow: hidden;
  display: flex; flex-direction: column;
}

/* HEADER */
#header {
  background: var(--bg2); border-bottom: 1px solid var(--border);
  padding: 8px 10px; display: flex; align-items: center; gap: 8px; flex-shrink: 0;
}
#own-avatar {
  width: 26px; height: 26px; border-radius: 4px; background: var(--bg4);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 10px; font-weight: 700;
  color: var(--text-muted); flex-shrink: 0; position: relative; user-select: none;
}
#own-status-dot {
  position: absolute; bottom: -2px; right: -2px;
  width: 8px; height: 8px; border-radius: 50%;
  border: 2px solid var(--bg2); background: var(--offline); transition: background .3s;
}
#own-info { flex: 1; min-width: 0; }
#own-name {
  font-family: var(--mono); font-size: 11px; font-weight: 600;
  color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#own-label { font-size: 10px; color: var(--text-muted); font-family: var(--mono); }
#notif-btn {
  background: none; border: 1px solid var(--border2); color: var(--text-muted);
  border-radius: 3px; padding: 3px 6px; cursor: pointer; font-size: 10px;
  font-family: var(--mono); transition: all .15s; white-space: nowrap; flex-shrink: 0;
}
#notif-btn:hover { border-color: var(--accent); color: var(--accent); }
#notif-btn.granted { display: none; }

/* STATUS BAR */
#status-bar {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 3px; padding: 6px 8px; border-bottom: 1px solid var(--border);
  flex-shrink: 0; background: var(--bg2);
}
.s-btn {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 5px 2px; border-radius: 3px; border: 1px solid transparent;
  background: var(--bg3); color: var(--text-muted); cursor: pointer;
  font-family: var(--mono); font-size: 9px; font-weight: 600;
  letter-spacing: .04em; text-transform: uppercase; transition: all .12s; position: relative;
}
.s-btn:hover { background: var(--bg4); color: var(--text); }
.s-btn.active { background: var(--bg4); border-color: var(--border2); color: var(--text); }
.s-btn .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.s-btn[data-status="online"]  .dot { background: var(--online); }
.s-btn[data-status="away"]    .dot { background: var(--away); }
.s-btn[data-status="dnd"]     .dot { background: var(--dnd); }
.s-btn[data-status="offline"] .dot { background: var(--text-dim); }
.auto-tag {
  position: absolute; top: 2px; right: 3px; font-size: 7px;
  color: var(--accent); font-family: var(--mono); font-weight: 700;
}

/* MSG ROW */
#msg-row {
  display: flex; gap: 4px; padding: 5px 8px;
  border-bottom: 1px solid var(--border); flex-shrink: 0; background: var(--bg2);
}
#status-msg {
  flex: 1; background: var(--bg3); border: 1px solid var(--border);
  color: var(--text); border-radius: 3px; padding: 4px 8px;
  font-size: 11px; font-family: var(--mono); outline: none; transition: border-color .15s;
}
#status-msg:focus { border-color: var(--accent); }
#status-msg::placeholder { color: var(--text-dim); }
#reset-btn {
  background: var(--bg3); border: 1px solid var(--border); color: var(--text-muted);
  border-radius: 3px; padding: 4px 8px; cursor: pointer;
  font-family: var(--mono); font-size: 10px; transition: all .12s; white-space: nowrap;
}
#reset-btn:hover { border-color: var(--border2); color: var(--text); }

/* MEMBER LIST */
#member-list { flex: 1; overflow-y: auto; padding: 2px 6px 6px; }
#member-list::-webkit-scrollbar { width: 3px; }
#member-list::-webkit-scrollbar-track { background: transparent; }
#member-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.member-row {
  display: flex; align-items: center; gap: 8px;
  padding: 4px 6px; border-radius: 3px; margin-bottom: 1px;
  cursor: default; transition: background .1s;
}
.member-row:hover { background: var(--bg3); }
.m-avatar {
  width: 26px; height: 26px; border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 10px; font-weight: 700;
  color: rgba(255,255,255,.7); flex-shrink: 0; position: relative; user-select: none;
}
.av0{background:#1a3a5c}.av1{background:#3a1a5c}.av2{background:#1a5c3a}
.av3{background:#5c3a1a}.av4{background:#5c1a1a}.av5{background:#1a4a5c}
.av6{background:#4a1a5c}.av7{background:#1a5c4a}
.m-dot {
  position: absolute; bottom: -1px; right: -1px;
  width: 8px; height: 8px; border-radius: 50%;
  border: 2px solid var(--bg); transition: background .3s;
}
.member-row:hover .m-dot { border-color: var(--bg3); }
.dot-online  { background: var(--online) !important; }
.dot-away    { background: var(--away)   !important; }
.dot-dnd     { background: var(--dnd)    !important; }
.dot-offline { background: var(--offline)!important; }
.m-info { flex: 1; min-width: 0; }
.m-name {
  font-family: var(--mono); font-size: 11px; font-weight: 600; color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.member-row.is-offline .m-name { color: var(--text-muted); }
.m-sub {
  font-size: 10px; color: var(--text-muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px;
}
.call-badge {
  display: flex; align-items: center; gap: 3px;
  font-family: var(--mono); font-size: 9px; font-weight: 700;
  color: var(--call); letter-spacing: .05em; padding: 2px 5px;
  border: 1px solid rgba(0,230,118,.2); border-radius: 2px;
  background: rgba(0,230,118,.06); flex-shrink: 0; animation: callpulse 2s infinite;
}
.call-badge::before {
  content:''; width:5px; height:5px; border-radius:50%;
  background: var(--call); animation: callpulse 2s infinite;
}
@keyframes callpulse { 0%,100%{opacity:1} 50%{opacity:.4} }
.list-divider { height:1px; background:var(--border); margin:4px 4px 5px; }
.group-hdr {
  display: flex; align-items: center; justify-content: space-between; padding: 6px 6px 2px;
}
.group-hdr .lbl {
  font-family: var(--mono); font-size: 9px; font-weight: 700;
  letter-spacing: .1em; text-transform: uppercase; color: var(--text-dim);
}
.group-hdr .cnt { font-family: var(--mono); font-size: 9px; color: var(--text-dim); }

/* BOTTOM BAR */
#bottom-bar {
  border-top: 1px solid var(--border); background: var(--bg2);
  padding: 4px 10px; display: flex; align-items: center; gap: 6px; flex-shrink: 0;
}
.live-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--online); animation: blink 2s infinite; flex-shrink: 0;
}
.live-dot.err { background: var(--dnd); animation: none; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.15} }
#bottom-text {
  font-family: var(--mono); font-size: 9px; color: var(--text-dim);
  flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#audio-btn {
  background: none; border: none; color: var(--text-dim); cursor: pointer;
  font-size: 13px; padding: 0 2px; transition: color .15s; line-height: 1; flex-shrink: 0;
}
#audio-btn:hover { color: var(--text); }

/* HINT */
#hint {
  flex: 1; display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 10px; color: var(--text-dim);
  padding: 20px; text-align: center; line-height: 2; white-space: pre-line;
}
</style>
</head>
<body>

<div id="header">
  <div id="own-avatar">--<div id="own-status-dot"></div></div>
  <div id="own-info">
    <div id="own-name">PULSE</div>
    <div id="own-label">verbinde…</div>
  </div>
  <button id="notif-btn" style="display:none">🔔 AN</button>
</div>

<div id="status-bar">
  <button class="s-btn active" data-status="online">
    <div class="dot"></div>ONLINE<span class="auto-tag" id="auto-tag">AUTO</span>
  </button>
  <button class="s-btn" data-status="away"><div class="dot"></div>WEG</button>
  <button class="s-btn" data-status="dnd"><div class="dot"></div>DND</button>
  <button class="s-btn" data-status="offline"><div class="dot"></div>UNSICHTB.</button>
</div>

<div id="msg-row">
  <input id="status-msg" type="text" placeholder="Statusnachricht…" maxlength="80">
  <button id="reset-btn">⟳ AUTO</button>
</div>

<div id="hint">PULSE\nlade…</div>
<div id="member-list" style="display:none"></div>

<div id="bottom-bar">
  <div class="live-dot err" id="live-dot"></div>
  <span id="bottom-text">verbinde…</span>
  <button id="audio-btn" title="Audio an/aus">🔊</button>
</div>

<script>
'use strict';

// ── Config ──────────────────────────────────────
// API_BASE: Backend-URL. Kann per ?api=https://... überschrieben werden.
// HS: Homeserver für eigenen Presence-Status setzen (Status-Buttons)
const params   = new URLSearchParams(location.search);
const API_BASE = (params.get("api") || "https://pulse.stiftung-waffentest.de").replace(/\/$/,"");
const HS       = params.get("hs") || "https://stiftung-waffentest.de";
const POLL_MS  = parseInt(params.get("poll") || "15000", 10);

const IDLE_MS  = 5  * 60 * 1000;
const AWAY_MS  = 15 * 60 * 1000;
const PUSH_MS  = 30_000;

// ── State ────────────────────────────────────────
const S = {
  token: null, userId: null,
  manualStatus: null, autoStatus: "online",
  lastActivity: Date.now(),
  audioOn: true,
  prevPresence: {},
  prevCalls: {},
};

const STATUS = {
  online:  {label:"Online",       dot:"dot-online",  presence:"online",      msg:""},
  away:    {label:"Abwesend",     dot:"dot-away",    presence:"unavailable", msg:"Abwesend"},
  dnd:     {label:"Nicht stören", dot:"dot-dnd",     presence:"online",      msg:"Nicht stören"},
  offline: {label:"Unsichtbar",   dot:"dot-offline", presence:"offline",     msg:""},
};

// ── Audio ────────────────────────────────────────
let _actx = null;
function actx() {
  if (!_actx) _actx = new (window.AudioContext || window.webkitAudioContext)();
  return _actx;
}
function tone(freq, type, dur, vol=0.25) {
  if (!S.audioOn) return;
  try {
    const ctx=actx(), osc=ctx.createOscillator(), g=ctx.createGain();
    osc.connect(g); g.connect(ctx.destination);
    osc.type=type; osc.frequency.setValueAtTime(freq, ctx.currentTime);
    g.gain.setValueAtTime(vol, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+dur);
    osc.start(); osc.stop(ctx.currentTime+dur);
  } catch(e){}
}
function sfx_online()  { tone(660,'sine',.1,.22); setTimeout(()=>tone(880,'sine',.18,.18),90); }
function sfx_offline() { tone(440,'sine',.1,.18); setTimeout(()=>tone(293,'sine',.2,.15),90); }
function sfx_call()    { tone(523,'sine',.08,.2); setTimeout(()=>tone(659,'sine',.08,.2),80); setTimeout(()=>tone(784,'sine',.18,.18),160); }
function sfx_callend() { tone(392,'sine',.1,.18); setTimeout(()=>tone(330,'sine',.18,.15),90); }

// ── Notifications ────────────────────────────────
function askNotif() {
  Notification.requestPermission().then(p => {
    if (p==='granted') document.getElementById('notif-btn').classList.add('granted');
  });
}
function notify(title, body, icon='🟢') {
  if (Notification.permission !== 'granted') return;
  try { new Notification(`${icon} ${title}`, {body, silent:true, tag:title}); } catch(e){}
}

// ── Widget postMessage / OpenID ──────────────────
// Für eigenen Presence-Status setzen brauchen wir den Token des eingeloggten Users
let widgetId=null, wSrc=null;
const _pend={};
function wpost(action, data={}) {
  const rid=Math.random().toString(36).slice(2);
  (wSrc||window.parent).postMessage({api:"fromWidget",widgetId,requestId:rid,action,data},"*");
  return new Promise(r=>{
    _pend[rid]=r;
    setTimeout(()=>{if(_pend[rid]){delete _pend[rid];r(null);}},8000);
  });
}
window.addEventListener("message", async e=>{
  const m=e.data; if(!m) return;
  if(m.requestId && _pend[m.requestId]){_pend[m.requestId](m.data??m.response);delete _pend[m.requestId];return;}
  if(m.action==="capabilities"){
    widgetId=m.widgetId||widgetId; wSrc=e.source;
    e.source.postMessage({
      api:"fromWidget", widgetId, requestId:m.requestId,
      action:"capabilities",
      data:{capabilities:["m.always_on_screen","org.matrix.msc2762.receive.state_events","org.matrix.msc2762.send.event"]}
    },"*");
    // OpenID sofort nach capabilities anfragen
    setTimeout(tryOpenId, 500);
    return;
  }
  if(m.action==="openid_credentials" && m.data?.access_token){
    wSrc=e.source;
    e.source.postMessage({api:"fromWidget",widgetId,requestId:m.requestId,action:"openid_credentials",data:{success:true}},"*");
    await useOpenId(m.data);
  }
});

async function tryOpenId(){
  let r=await wpost("get_openid",{});
  if(r?.access_token){await useOpenId(r);return;}
  r=await wpost("org.matrix.msc2762.get_openid",{});
  if(r?.access_token){await useOpenId(r);return;}
  // Fallback: localStorage (Element Desktop)
  tryLocalStorage();
}

async function useOpenId(od){
  try{
    const r=await fetch(`${HS}/_matrix/federation/v1/openid/userinfo?access_token=${od.access_token}`);
    if(r.ok){const d=await r.json();S.userId=S.userId||d.sub;}
  }catch{}
  S.token=od.access_token;
  initOwnStatus();
}

function tryLocalStorage(){
  try{
    for(const k of Object.keys(localStorage)){
      if(k.includes("mx_access_token")) S.token=localStorage.getItem(k);
      if(k.includes("mx_user_id")&&!S.userId) S.userId=localStorage.getItem(k);
    }
    if(S.token) initOwnStatus();
  }catch{}
}

// ── Matrix API (nur für eigenen Status) ──────────
const enc=s=>encodeURIComponent(s);
async function matrixPut(path, body){
  if(!S.token) return;
  try{
    await fetch(`${HS}/_matrix/client/v3${path}`,{
      method:"PUT",
      headers:{Authorization:`Bearer ${S.token}`,"Content-Type":"application/json"},
      body:JSON.stringify(body),
    });
  }catch{}
}
async function setPresence(key, msg){
  if(!S.userId||!S.token) return;
  const s=STATUS[key];
  const m=msg!==undefined?msg:s.msg;
  await matrixPut(`/presence/${enc(S.userId)}/status`,{presence:s.presence,status_msg:m});
}

// ── Boot ─────────────────────────────────────────
async function boot(){
  const p=new URLSearchParams(location.search);
  S.userId  = p.get("userId")||p.get("user_id")||null;
  widgetId  = p.get("widgetId")||"pulse-widget";
  S.audioOn = p.get("audio")!=="0";

  // Notification-Button
  if(Notification.permission==='granted')
    document.getElementById('notif-btn').classList.add('granted');
  else if(Notification.permission!=='denied')
    document.getElementById('notif-btn').style.display='';

  // Sofort Daten vom Backend laden — kein Token nötig
  startPolling();

  // Parallel: eigenen Token für Status-Buttons holen
  setTimeout(tryOpenId, 1000);
}

// ── Backend polling ──────────────────────────────
function startPolling(){
  fetchAndRender();
  setInterval(fetchAndRender, POLL_MS);
}

async function fetchAndRender(){
  try{
    const res=await fetch(`${API_BASE}/api/presence`);
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const data=await res.json();
    processData(data);
    setBottom(`${Object.values(data).filter(u=>u.presence!=='offline').length} online · ${Object.keys(data).length} gesamt`, false);
  }catch(err){
    setBottom(`Fehler: ${err.message}`, true);
  }
}

function processData(data){
  const entries=Object.values(data);

  // Eigener User — Header aktualisieren
  if(S.userId && data[S.userId]){
    const me=data[S.userId];
    const name=S.userId.split(":")[0].replace("@","");
    document.getElementById('own-name').textContent=name;
    document.getElementById('own-avatar').childNodes[0].nodeValue=name.slice(0,2).toUpperCase();
    document.getElementById('own-status-dot').style.background=
      {online:"var(--online)",unavailable:"var(--away)",offline:"var(--offline)"}[me.presence]||"var(--offline)";
    document.getElementById('own-label').textContent=
      S.manualStatus===null ? (STATUS[S.autoStatus]?.label||"Online")+" (auto)" : STATUS[S.manualStatus]?.label||"";
  }

  // Änderungs-Detection → Audio + Notification
  for(const u of entries){
    const uid=u.userId;
    const name=uid.split(":")[0].replace("@","");
    const prevSt=S.prevPresence[uid];
    const prevCl=S.prevCalls[uid];

    if(prevSt!==undefined){
      if(prevSt!==u.presence){
        if(u.presence==="online")  {sfx_online();  notify(name,"ist jetzt online","🟢");}
        if(u.presence==="offline") {sfx_offline(); notify(name,"ist offline gegangen","⚫");}
      }
    }
    if(prevCl!==undefined && prevCl!==u.call?.inCall){
      if(u.call?.inCall)  {sfx_call();    notify(name,"ist einem Call beigetreten","🎙️");}
      if(!u.call?.inCall) {sfx_callend(); notify(name,"hat den Call verlassen","📵");}
    }
    S.prevPresence[uid]=u.presence;
    S.prevCalls[uid]=u.call?.inCall||false;
  }

  renderMembers(data);
}

// ── Render ────────────────────────────────────────
function renderMembers(data){
  const list=document.getElementById('member-list');
  document.getElementById('hint').style.display='none';
  list.style.display='';

  // Bot-Account ausblenden
  const entries=Object.values(data).filter(u=>!u.userId.includes('pulse-bot'));
  if(!entries.length){ list.innerHTML=''; return; }

  const ord={online:0,dnd:1,unavailable:1,away:2,offline:3};
  entries.sort((a,b)=>(ord[a.presence]??4)-(ord[b.presence]??4)||
    a.userId.localeCompare(b.userId));

  const groups=[
    {label:"ONLINE",   items:entries.filter(u=>u.presence==="online")},
    {label:"ABWESEND", items:entries.filter(u=>u.presence==="unavailable")},
    {label:"OFFLINE",  items:entries.filter(u=>u.presence==="offline")},
  ];

  list.innerHTML="";
  let addedDivider=false;

  for(const {label,items} of groups){
    if(!items.length) continue;
    if(label==="OFFLINE" && entries.some(u=>u.presence!=="offline") && !addedDivider){
      const div=document.createElement('div'); div.className='list-divider'; list.appendChild(div);
      addedDivider=true;
    }
    const ghdr=document.createElement('div'); ghdr.className='group-hdr';
    ghdr.innerHTML=`<span class="lbl">${label}</span><span class="cnt">${items.length}</span>`;
    list.appendChild(ghdr);

    for(const u of items){
      const uid=u.userId;
      let h=0; for(const c of uid) h=(h*31+c.charCodeAt(0))&0xffff;
      const av="av"+(h%8);
      const name=uid.split(":")[0].replace("@","");
      const ini=name.slice(0,2).toUpperCase();

      // Status-Dot: presence + statusMsg für DND/Away
      let dotClass='dot-offline', subLabel='';
      const sm=u.statusMsg||"";
      if(sm==="Nicht stören")       {dotClass='dot-dnd';     subLabel="Nicht stören";}
      else if(sm==="Abwesend")      {dotClass='dot-away';    subLabel="Abwesend";}
      else if(u.presence==="online"){dotClass='dot-online';  subLabel=sm||"";}
      else if(u.presence==="unavailable"){dotClass='dot-away'; subLabel=sm||"Abwesend";}
      else                          {dotClass='dot-offline'; subLabel="";}

      const inCall=u.call?.inCall||false;
      if(inCall) subLabel="🎙 Im Call";
      const ago=fmtAgo(u.lastActiveAgo);

      const row=document.createElement('div');
      row.className=`member-row${u.presence==="offline"?" is-offline":""}`;
      row.innerHTML=`
        <div class="m-avatar ${av}">${esc(ini)}<div class="m-dot ${dotClass}"></div></div>
        <div class="m-info">
          <div class="m-name">${esc(name)}</div>
          <div class="m-sub">${esc(subLabel)}${ago&&!inCall?` · ${ago}`:""}</div>
        </div>
        ${inCall?`<div class="call-badge">CALL</div>`:""}
      `;
      list.appendChild(row);
    }
  }
}

// ── Eigener Status (braucht Token) ────────────────
function initOwnStatus(){
  if(!S.token) return;
  setPresence("online","");
  updateBar();
  setInterval(checkIdle, 30_000);
  setInterval(()=>setPresence(cur(), document.getElementById('status-msg').value.trim()||undefined), PUSH_MS);
}

function onActivity(){
  S.lastActivity=Date.now();
  if(S.manualStatus===null&&S.autoStatus!=="online"){
    S.autoStatus="online";
    setPresence("online", document.getElementById('status-msg').value.trim()||"");
    updateBar();
  }
}
["mousemove","keydown","click","scroll"].forEach(ev=>
  document.addEventListener(ev,onActivity,{passive:true})
);
function checkIdle(){
  if(S.manualStatus!==null) return;
  const idle=Date.now()-S.lastActivity;
  const next=idle>=AWAY_MS?"offline":idle>=IDLE_MS?"away":"online";
  if(next!==S.autoStatus){S.autoStatus=next;setPresence(next);updateBar();}
}
function cur(){return S.manualStatus||S.autoStatus;}

// ── UI ─────────────────────────────────────────────
function updateBar(){
  const key=cur(), isAuto=S.manualStatus===null;
  document.querySelectorAll('.s-btn').forEach(b=>b.classList.toggle('active',b.dataset.status===key));
  document.getElementById('auto-tag').style.display=isAuto?'':'none';
  document.getElementById('own-status-dot').style.background=
    {online:"var(--online)",away:"var(--away)",dnd:"var(--dnd)",offline:"var(--offline)"}[key]||"var(--offline)";
  document.getElementById('own-label').textContent=
    isAuto?STATUS[key].label+" (auto)":STATUS[key].label;
}
function setBottom(msg,err=false){
  document.getElementById('bottom-text').textContent=msg;
  document.getElementById('live-dot').classList.toggle('err',err);
}
function fmtAgo(ms){
  if(!ms) return "";
  const m=Math.round(ms/60000);
  if(m<1)  return "gerade";
  if(m<60) return `${m} min`;
  const h=Math.round(m/60);
  return h<24?`${h} Std`:`${Math.round(h/24)} d`;
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

// ── Events ──────────────────────────────────────────
document.querySelectorAll('.s-btn').forEach(b=>b.addEventListener('click',()=>{
  S.manualStatus=b.dataset.status;
  setPresence(b.dataset.status, document.getElementById('status-msg').value.trim()||undefined);
  updateBar(); actx();
}));
document.getElementById('status-msg').addEventListener('keydown',e=>{
  if(e.key==='Enter') setPresence(cur(),e.target.value.trim()||undefined);
});
document.getElementById('reset-btn').addEventListener('click',()=>{
  S.manualStatus=null; S.autoStatus="online";
  document.getElementById('status-msg').value="";
  setPresence("online",""); updateBar();
});
document.getElementById('audio-btn').addEventListener('click',()=>{
  S.audioOn=!S.audioOn;
  document.getElementById('audio-btn').textContent=S.audioOn?"🔊":"🔇";
  actx();
  if(S.audioOn) sfx_online();
});
document.getElementById('notif-btn').addEventListener('click',askNotif);

boot();
</script>
</body>
</html>
