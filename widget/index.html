<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PULSE – Presence</title>
<style>
  /* ── Reset & base ─────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-primary:    #1e1f22;
    --bg-secondary:  #2b2d31;
    --bg-hover:      #35373c;
    --bg-tooltip:    #111214;
    --green:         #23a55a;
    --yellow:        #f0b232;
    --red:           #f23f43;
    --grey:          #80848e;
    --purple:        #5865f2;
    --text-primary:  #f2f3f5;
    --text-muted:    #949ba4;
    --text-xs:       11px;
    --text-sm:       13px;
    --radius:        4px;
    --dot-size:      10px;
    --avatar-size:   32px;
  }

  body {
    font-family: "gg sans", "Noto Sans", Whitney, -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    font-size: var(--text-sm);
    line-height: 1.4;
    overflow-x: hidden;
  }

  /* ── Layout ───────────────────────────────────────────────── */
  #app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    padding: 8px 4px;
    gap: 2px;
  }

  /* ── Section header ───────────────────────────────────────── */
  .section-header {
    padding: 16px 8px 4px;
    font-size: var(--text-xs);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .03em;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 6px;
    user-select: none;
  }
  .section-header .count {
    font-weight: 400;
    color: var(--text-muted);
  }

  /* ── Member row ───────────────────────────────────────────── */
  .member {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 2px 8px;
    border-radius: var(--radius);
    cursor: default;
    transition: background 80ms;
    min-height: 42px;
  }
  .member:hover { background: var(--bg-hover); }

  /* ── Avatar + status dot ──────────────────────────────────── */
  .avatar-wrap {
    position: relative;
    flex-shrink: 0;
    width: var(--avatar-size);
    height: var(--avatar-size);
  }
  .avatar {
    width: var(--avatar-size);
    height: var(--avatar-size);
    border-radius: 50%;
    background: var(--bg-secondary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-primary);
    overflow: hidden;
    user-select: none;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }

  .status-dot {
    position: absolute;
    bottom: -1px; right: -1px;
    width: var(--dot-size);
    height: var(--dot-size);
    border-radius: 50%;
    border: 2px solid var(--bg-primary);
    transition: background 300ms;
  }
  .member:hover .status-dot { border-color: var(--bg-hover); }

  .status-dot.online      { background: var(--green); }
  .status-dot.unavailable { background: var(--yellow); }
  .status-dot.dnd         { background: var(--red); }
  .status-dot.offline     { background: var(--grey); }

  /* ── Name & activity ──────────────────────────────────────── */
  .member-info { flex: 1; overflow: hidden; }
  .display-name {
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: color 200ms;
  }
  .member.offline .display-name { color: var(--text-muted); }

  .status-text {
    font-size: var(--text-xs);
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 1px;
  }

  /* ── In-call badge ────────────────────────────────────────── */
  .call-badge {
    display: flex;
    align-items: center;
    gap: 4px;
    background: rgba(35,165,90,.15);
    border: 1px solid rgba(35,165,90,.3);
    border-radius: 12px;
    padding: 2px 7px;
    font-size: var(--text-xs);
    color: var(--green);
    font-weight: 600;
    flex-shrink: 0;
    animation: pulse 2s infinite;
  }
  .call-badge svg { width: 10px; height: 10px; fill: currentColor; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: .65; }
  }

  /* ── Divider ──────────────────────────────────────────────── */
  .divider {
    height: 1px;
    background: var(--bg-secondary);
    margin: 4px 8px;
  }

  /* ── Error / loading states ───────────────────────────────── */
  #status-bar {
    font-size: var(--text-xs);
    color: var(--text-muted);
    padding: 4px 10px 2px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .dot-live {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--green);
    animation: blink 1.6s infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }

  #error-msg {
    background: rgba(242,63,67,.12);
    border: 1px solid rgba(242,63,67,.3);
    color: #f23f43;
    border-radius: var(--radius);
    margin: 8px;
    padding: 8px 12px;
    font-size: var(--text-xs);
    display: none;
  }

  /* ── Scrollable list ──────────────────────────────────────── */
  #members-list { overflow-y: auto; flex: 1; }
  #members-list::-webkit-scrollbar { width: 4px; }
  #members-list::-webkit-scrollbar-track { background: transparent; }
  #members-list::-webkit-scrollbar-thumb { background: var(--bg-hover); border-radius: 2px; }
</style>
</head>
<body>
<div id="app">
  <div id="status-bar">
    <div class="dot-live" id="live-dot" style="opacity:0"></div>
    <span id="status-text">Connecting…</span>
  </div>
  <div id="error-msg"></div>
  <div id="members-list"></div>
</div>

<script>
// ── Config ────────────────────────────────────────────────────
// The widget reads its API base URL from a query param or falls back
// to the same origin (when served by the bot itself via /widget/).
const params      = new URLSearchParams(location.search);
const API_BASE    = (params.get("api") || "").replace(/\/$/, "") || "";
const POLL_MS     = parseInt(params.get("poll") || "12000", 10);
const AUDIO_ENABLED = params.get("audio") !== "0";

// ── Audio ─────────────────────────────────────────────────────
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playTone(frequency, type, duration, volume = 0.3) {
  if (!AUDIO_ENABLED) return;
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = type;
    osc.frequency.setValueAtTime(frequency, ctx.currentTime);
    gain.gain.setValueAtTime(volume, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.start();
    osc.stop(ctx.currentTime + duration);
  } catch (e) { /* autoplay blocked until user interaction */ }
}

// Discord-style: online = ascending two-tone, offline = descending
function playOnlineSound() {
  playTone(660, "sine", 0.12, 0.25);
  setTimeout(() => playTone(880, "sine", 0.18, 0.2), 100);
}
function playOfflineSound() {
  playTone(440, "sine", 0.12, 0.2);
  setTimeout(() => playTone(330, "sine", 0.18, 0.18), 100);
}

// ── State ─────────────────────────────────────────────────────
let prevState = {}; // userId -> presence string

// ── DOM helpers ───────────────────────────────────────────────
function setStatus(msg, live = false) {
  document.getElementById("status-text").textContent = msg;
  document.getElementById("live-dot").style.opacity = live ? "1" : "0";
}

function showError(msg) {
  const el = document.getElementById("error-msg");
  el.textContent = "⚠ " + msg;
  el.style.display = "block";
}

function hideError() {
  document.getElementById("error-msg").style.display = "none";
}

function getInitials(userId) {
  const local = userId.split(":")[0].replace("@", "");
  return local.slice(0, 2).toUpperCase();
}

function getDisplayName(userId) {
  // Widget only knows userIds. A future enhancement can resolve display names
  // via the API. For now, show the local part of the MXID.
  return userId.split(":")[0].replace("@", "");
}

function presenceLabel(p) {
  switch (p) {
    case "online":      return "Online";
    case "unavailable": return "Away";
    case "dnd":         return "Do Not Disturb";
    default:            return "Offline";
  }
}

// ── Render ────────────────────────────────────────────────────
function render(data) {
  const list = document.getElementById("members-list");

  // Sort: online > unavailable/dnd > offline; then alphabetical
  const presenceOrder = { online: 0, unavailable: 1, dnd: 1, offline: 2 };
  const entries = Object.values(data).sort((a, b) => {
    const po = (presenceOrder[a.presence] ?? 2) - (presenceOrder[b.presence] ?? 2);
    if (po !== 0) return po;
    return getDisplayName(a.userId).localeCompare(getDisplayName(b.userId));
  });

  // Group
  const groups = {
    online:  entries.filter(u => u.presence === "online"),
    away:    entries.filter(u => u.presence === "unavailable" || u.presence === "dnd"),
    offline: entries.filter(u => u.presence === "offline"),
  };

  const totalOnline = groups.online.length + groups.away.length;

  // Check for changes and play sounds
  entries.forEach(u => {
    const prev = prevState[u.userId];
    if (prev !== undefined && prev !== u.presence) {
      if (u.presence === "online")  playOnlineSound();
      if (u.presence === "offline") playOfflineSound();
    }
    prevState[u.userId] = u.presence;
  });

  list.innerHTML = "";

  function renderSection(label, users) {
    if (users.length === 0) return;
    const header = document.createElement("div");
    header.className = "section-header";
    header.innerHTML = `${label} <span class="count">— ${users.length}</span>`;
    list.appendChild(header);

    users.forEach(u => {
      const inCall = u.call?.inCall;
      const statusText = u.statusMsg || (inCall ? "In a voice call" : presenceLabel(u.presence));
      const dotClass = u.presence === "unavailable" ? "unavailable"
                     : u.presence === "dnd"         ? "dnd"
                     : u.presence === "online"       ? "online"
                     : "offline";

      const row = document.createElement("div");
      row.className = `member ${u.presence === "offline" ? "offline" : ""}`;
      row.innerHTML = `
        <div class="avatar-wrap">
          <div class="avatar">${getInitials(u.userId)}</div>
          <div class="status-dot ${dotClass}"></div>
        </div>
        <div class="member-info">
          <div class="display-name">${escHtml(getDisplayName(u.userId))}</div>
          <div class="status-text">${escHtml(statusText)}</div>
        </div>
        ${inCall ? `
        <div class="call-badge">
          <svg viewBox="0 0 24 24"><path d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
          CALL
        </div>` : ""}
      `;
      list.appendChild(row);
    });
  }

  renderSection("Online", groups.online);
  renderSection("Away", groups.away);
  if (groups.online.length + groups.away.length > 0 && groups.offline.length > 0) {
    const div = document.createElement("div");
    div.className = "divider";
    list.appendChild(div);
  }
  renderSection("Offline", groups.offline);

  setStatus(`${totalOnline} online · ${entries.length} members`, true);
}

function escHtml(str) {
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// ── Poll loop ─────────────────────────────────────────────────
let consecutiveErrors = 0;

async function poll() {
  try {
    const res = await fetch(`${API_BASE}/api/presence`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    hideError();
    consecutiveErrors = 0;
    render(data);
  } catch (err) {
    consecutiveErrors++;
    setStatus("Connection error", false);
    if (consecutiveErrors >= 2) showError(`Cannot reach API: ${err.message}`);
  }
}

// Start
poll();
setInterval(poll, POLL_MS);
</script>
</body>
</html>
